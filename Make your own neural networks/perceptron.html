<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Perceptron Network - Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/OrbitControls.js"></script>

<script>
class Perceptron3D {
  constructor(scene, inputCount = 3, position = new THREE.Vector3(0, 0, 0)) {
    this.scene = scene;
    this.inputCount = inputCount;
    this.position = position;

    this.inputs = [];
    this.lines = [];

    this._createInputs();
    this._createNeuron();
    this._createOutput();
    this._connectAll();
  }

  _createInputs() {
    const inputGeometry = new THREE.SphereGeometry(0.2, 32, 32);
    const inputMaterial = new THREE.MeshStandardMaterial({ color: 0x3498db });

    const spacing = 1.5;
    for (let i = 0; i < this.inputCount; i++) {
      const sphere = new THREE.Mesh(inputGeometry, inputMaterial);
      const yOffset = (i - (this.inputCount - 1) / 2) * spacing;
      sphere.position.set(this.position.x - 4, this.position.y + yOffset, this.position.z);
      this.scene.add(sphere);
      this.inputs.push(sphere);
    }
  }

  _createNeuron() {
    const geometry = new THREE.SphereGeometry(0.6, 32, 32);
    const material = new THREE.MeshStandardMaterial({ color: 0xe67e22 });
    this.neuron = new THREE.Mesh(geometry, material);
    this.neuron.position.copy(this.position);
    this.scene.add(this.neuron);
  }

  _createOutput() {
    const geometry = new THREE.SphereGeometry(0.3, 32, 32);
    const material = new THREE.MeshStandardMaterial({ color: 0x2ecc71 });
    this.output = new THREE.Mesh(geometry, material);
    this.output.position.set(this.position.x + 4, this.position.y, this.position.z);
    this.scene.add(this.output);
  }

  _connectAll() {
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });

    // Inputs -> Neuron
    this.inputs.forEach(input => {
      const geometry = new THREE.BufferGeometry().setFromPoints([
        input.position, this.neuron.position
      ]);
      const line = new THREE.Line(geometry, lineMaterial);
      this.scene.add(line);
      this.lines.push(line);
    });

    // Neuron -> Output
    const geometry = new THREE.BufferGeometry().setFromPoints([
      this.neuron.position, this.output.position
    ]);
    const line = new THREE.Line(geometry, lineMaterial);
    this.scene.add(line);
    this.lines.push(line);
  }

  animate() {
    this.neuron.rotation.y += 0.01;
  }
}

// -------------------- MAIN SCENE SETUP --------------------

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);

// Lights
scene.add(new THREE.PointLight(0xffffff, 1, 50).position.set(10,10,10));
scene.add(new THREE.AmbientLight(0x404040));

// Create multiple perceptrons
const perceptrons = [
  new Perceptron3D(scene, 3, new THREE.Vector3(0, 4, 0)),
  new Perceptron3D(scene, 4, new THREE.Vector3(0, 0, 0)),
  new Perceptron3D(scene, 2, new THREE.Vector3(0, -4, 0)),
];

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  perceptrons.forEach(p => p.animate());
  renderer.render(scene, camera);
}
animate();

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
